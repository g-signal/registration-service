micronaut:
  env: gcp
  application:
    name: registrationService

  metrics:
    binders:
      netty:
        queues:
          enabled: true

    export:
      datadog:
        enabled: false
        step: 20s

      otlp:
        enabled: false
        step: 20s

    tags:
      # Note that an `instance` tag is added at runtime in `Application.java`
      service: registration

  executors:
    scheduled:
      type: scheduled
      core-pool-size: 16

# OpenTelemetry SDK autoconfiguration
# (https://opentelemetry.io/docs/languages/java/configuration/#zero-code-sdk-autoconfigure)
# is consumed by io.micronaut.tracing.opentelemetry.DefaultOpenTelemetryFactory.
#
# The SDK is disabled: we do not deploy an OTel collector, and the OTEL logback
# appender has been removed from logback.xml, so there is nothing to export.
# With this set, DefaultOpenTelemetryFactory still supplies a no-op OpenTelemetry
# instance, so OpenTelemetryLogbackSdkInitializer starts up cleanly.
#
# Note this does not affect metrics: `micronaut.metrics.export.otlp` is
# Micrometer's own OTLP registry and is configured independently.
otel:
  sdk:
    disabled: true
  logs:
    exporter: none
  traces:
    exporter: none
  metrics:
    exporter: none
