name: Build and push to Docker Hub

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Docker tag to use (default: branch name)'
        required: false
        type: string

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Set up JDK
        uses: actions/setup-java@f2beeb24e141e01a676f977032f5a29d81c9e27e # v5.1.0
        with:
          distribution: 'temurin'
          java-version-file: .java-version
          cache: 'maven'

      - name: Log in to Docker Hub
        uses: docker/login-action@1f401f745bf57e30b3a2800ad308a87d2ebdf14b # v3.0.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Determine Docker tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" == "release" ]; then
            echo "docker_tag=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT
          elif [ "${{ inputs.tag }}" != "" ]; then
            echo "docker_tag=${{ inputs.tag }}" >> $GITHUB_OUTPUT
          else
            echo "docker_tag=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT
          fi

      - name: Build and push to Docker Hub
        run: |
          ./mvnw -e -B deploy \
            -Dpackaging=docker \
            -DskipTests=true \
            -Djib.to.image="${{ secrets.DOCKERHUB_USERNAME }}/registration-service:${{ steps.tag.outputs.docker_tag }}"

      - name: Push latest tag (for releases only)
        if: github.event_name == 'release'
        run: |
          ./mvnw -e -B jib:build \
            -Dpackaging=docker \
            -DskipTests=true \
            -Djib.to.image="${{ secrets.DOCKERHUB_USERNAME }}/registration-service:latest"